<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DG-LAB 小游戏操纵端</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            /* 手机端防抖、防选择、优化触摸体验 */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .game-select-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .game-card {
            border: 1px solid #222222;
            padding: 20px;
            cursor: pointer;
        }
        .game-card:active {
            border-color: #ffffff;
        }
        .back-btn {
            margin-bottom: 20px;
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* 摇骰子大屏显示 */
        .dice-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .dice-box {
            width: 70px;
            height: 70px;
            border: 1px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-family: monospace;
            background-color: #000000;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部状态栏 -->
        <header class="flex-row">
            <h1>DG-LAB 小游戏</h1>
            <span id="ping-badge" class="sub-text">网速延迟: --ms</span>
        </header>

        <!-- 1. 游戏选择列表首屏 -->
        <div id="screen-select">
            <h2 style="margin-bottom: 20px;">选择挑战游戏</h2>
            <div class="game-select-container">
                <div class="game-card" onclick="startGame('shake')">
                    <h3>手抖挑战</h3>
                    <p class="sub-text" style="margin-top: 5px;">端平手机，防止弹珠滑出安全区</p>
                </div>
                <div class="game-card" onclick="startGame('angle')">
                    <h3>保持角度</h3>
                    <p class="sub-text" style="margin-top: 5px;">使手机倾斜度维持在安全区间内</p>
                </div>
                <div class="game-card" onclick="startGame('dice')">
                    <h3>摇骰子对决</h3>
                    <p class="sub-text" style="margin-top: 5px;">摇晃手机与对手比大小，输者遭受差额惩罚</p>
                </div>
            </div>
        </div>

        <!-- 2. 小游戏运行与配置区域 -->
        <div id="screen-play" style="display: none;">
            <button class="back-btn" onclick="exitGame()">返回列表</button>
            
            <div class="grid">
                <!-- 游戏渲染视窗 -->
                <div class="panel">
                    <h2 id="game-title">游戏进行中</h2>
                    
                    <!-- 游戏 1 & 2 的 Canvas 容器 -->
                    <div id="game-viewport" class="canvas-container">
                        <canvas id="game-canvas"></canvas>
                    </div>

                    <!-- 游戏 3 摇骰子交互区 -->
                    <div id="dice-viewport" style="display: none; text-align: center; padding: 20px 0;">
                        <div id="dice-instruction" class="sub-text" style="font-size: 1rem; margin-bottom: 20px;">
                            摇晃手机 或 点击下方按钮开始摇号
                        </div>
                        
                        <div class="dice-area">
                            <div class="dice-box" id="dice-1">-</div>
                            <div class="dice-box" id="dice-2">-</div>
                            <div class="dice-box" id="dice-3">-</div>
                        </div>

                        <div id="dice-scores" class="sub-text" style="margin-bottom: 20px; font-size: 0.95rem;">
                            玩家总分: - | 对手总分: -
                        </div>

                        <button id="btn-roll" onclick="rollDicesManual()" style="width: 100%;">手动摇号</button>
                    </div>
                </div>

                <!-- 游戏专属自定义配置 -->
                <div class="panel">
                    <h2>游戏设置</h2>

                    <!-- 惩罚力度滑块 (公共设置) -->
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>基础惩罚强度</span>
                            <span id="val-base-strength">20</span>
                        </div>
                        <input type="range" id="base-strength" min="0" max="200" value="20" oninput="updateVal('base-strength')">
                    </div>

                    <div class="slider-container">
                        <div class="slider-label">
                            <span>最大惩罚强度</span>
                            <span id="val-max-strength">60</span>
                        </div>
                        <input type="range" id="max-strength" min="0" max="200" value="60" oninput="updateVal('max-strength')">
                    </div>

                    <hr style="border-color: #222222; margin: 20px 0;">

                    <!-- 游戏 1 手抖配置 -->
                    <div id="settings-shake" class="game-settings" style="display: none;">
                        <div style="margin-bottom: 15px;">
                            <label class="slider-label" style="margin-bottom: 5px;">游戏模式</label>
                            <select id="shake-mode" onchange="initShakeGame()">
                                <option value="radius">安全半径模式</option>
                                <option value="gap">夹缝生存模式</option>
                            </select>
                        </div>

                        <div class="slider-container">
                            <div class="slider-label">
                                <span>安全区大小 (像素)</span>
                                <span id="val-shake-radius">50</span>
                            </div>
                            <input type="range" id="shake-radius" min="15" max="120" value="50" oninput="updateVal('shake-radius')">
                        </div>
                    </div>

                    <!-- 游戏 2 保持角度配置 -->
                    <div id="settings-angle" class="game-settings" style="display: none;">
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>安全角度上限 (度)</span>
                                <span id="val-angle-max">50</span>
                            </div>
                            <input type="range" id="angle-max" min="0" max="90" value="50" oninput="updateVal('angle-max')">
                        </div>

                        <div class="slider-container">
                            <div class="slider-label">
                                <span>安全角度下限 (度)</span>
                                <span id="val-angle-min">30</span>
                            </div>
                            <input type="range" id="angle-min" min="0" max="90" value="30" oninput="updateVal('angle-min')">
                        </div>
                    </div>

                    <!-- 游戏 3 摇骰子配置 -->
                    <div id="settings-dice" class="game-settings" style="display: none;">
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>最小持续时间 (秒)</span>
                                <span id="val-dice-time-min">1.0</span>
                            </div>
                            <input type="range" id="dice-time-min" min="0.5" max="5.0" step="0.5" value="1.0" oninput="updateVal('dice-time-min')">
                        </div>

                        <div class="slider-container">
                            <div class="slider-label">
                                <span>最大持续时间 (秒)</span>
                                <span id="val-dice-time-max">4.0</span>
                            </div>
                            <input type="range" id="dice-time-max" min="0.5" max="10.0" step="0.5" value="4.0" oninput="updateVal('dice-time-max')">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
