<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">是否需要安装网页证书</title><desc id="desc">Android APK 不需要网页证书，手机浏览器的传感器玩法需要 HTTPS 证书</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#070a12"/></linearGradient>
    <linearGradient id="a4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <filter id="s4"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".3"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.t{fill:#f8fafc;font-size:36px;font-weight:750}.s{fill:#8291a8;font-size:18px}.h{fill:#f8fafc;font-size:25px;font-weight:750}.p{fill:#b7c4d7;font-size:17px}.yes{fill:#4ade80;font-size:21px;font-weight:800}.warn{fill:#fbbf24;font-size:21px;font-weight:800}.small{fill:#8291a8;font-size:15px}</style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg4)"/><text x="64" y="72" class="t">证书怎么选：先看你用 APK 还是浏览器</text><text x="64" y="108" class="s">证书只解决“网页读取手机感应器”的安全权限，不负责设备 App 绑定</text>
  <g filter="url(#s4)">
    <rect x="64" y="158" width="520" height="402" rx="26" fill="#0b1120" stroke="#4ade80" stroke-opacity=".55" stroke-width="2"/>
    <rect x="104" y="198" width="82" height="142" rx="18" fill="#111c31" stroke="#67e8f9" stroke-width="3"/><rect x="118" y="220" width="54" height="78" rx="10" fill="url(#a4)" opacity=".75"/><circle cx="145" cy="318" r="7" fill="#67e8f9"/>
    <text x="218" y="222" class="h">Android 15+ 使用 APK</text><text x="218" y="266" class="yes">不需要安装网页根证书</text><text x="218" y="306" class="p">APK 直接读取 Android 原生传感器</text><text x="218" y="338" class="p">使用普通 HTTP/WS 连接电脑即可</text>
    <rect x="104" y="388" width="440" height="112" rx="18" fill="#0d251c"/><path d="M134 436l18 18 38-46" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="214" y="432" class="p">推荐流程</text><text x="214" y="466" fill="#f8fafc" font-size="18" font-weight="700">扫描“Android APK”二维码</text>

    <rect x="616" y="158" width="520" height="402" rx="26" fill="#0b1120" stroke="#fbbf24" stroke-opacity=".55" stroke-width="2"/>
    <rect x="656" y="198" width="82" height="142" rx="18" fill="#111c31" stroke="#fbbf24" stroke-width="3"/><circle cx="697" cy="255" r="23" fill="none" stroke="#fbbf24" stroke-width="5"/><path d="M681 255l11 11 21-25" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="770" y="222" class="h">iPhone 或 Android 浏览器</text><text x="770" y="266" class="warn">感应玩法建议安装证书</text><text x="770" y="306" class="p">手抖挑战、保持角度需要 HTTPS</text><text x="770" y="338" class="p">骰子手动摇号、角子机可不依赖感应器</text>
    <rect x="656" y="388" width="440" height="112" rx="18" fill="#2a210b"/><path d="M687 414l24 42h-48z" fill="#fbbf24"/><rect x="684" y="429" width="6" height="15" rx="3" fill="#2a210b"/><circle cx="687" cy="450" r="3" fill="#2a210b"/><text x="766" y="432" class="p">iPhone 安装后还要</text><text x="766" y="466" fill="#f8fafc" font-size="18" font-weight="700">手动开启“完全信任”</text>
  </g>
  <text x="600" y="622" text-anchor="middle" class="small">根证书只从当前电脑控制台下载；不要发送或复制 Mac 应用数据目录中的任何私钥文件</text>
</svg>
