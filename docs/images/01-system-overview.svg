<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">GameBridge for Fun 三端协作示意图</title>
  <desc id="desc">设备 App、电脑桥接服务和 GameBridge for Fun APK 的连接关系</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#070a12"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#67e8f9"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{fill:#f8fafc;font-size:36px;font-weight:750}.sub{fill:#8291a8;font-size:18px}.label{fill:#f8fafc;font-size:24px;font-weight:700}.note{fill:#b7c4d7;font-size:17px}.step{fill:#06101e;font-size:18px;font-weight:800}.tag{fill:#4ade80;font-size:16px;font-weight:700}</style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="100" cy="40" r="210" fill="#3b82f6" opacity=".12"/><circle cx="1130" cy="150" r="220" fill="#67e8f9" opacity=".07"/>
  <text x="64" y="72" class="title">先看懂：实际使用时谁负责什么</text>
  <text x="64" y="108" class="sub">设备 App、电脑桥接服务、GameBridge for Fun APK 必须同时在线</text>

  <!-- 左侧手机：设备 App 与硬件保持连接。 -->
  <g filter="url(#shadow)">
    <rect x="64" y="166" width="292" height="378" rx="26" fill="#0b1120" stroke="#263654" stroke-width="2"/>
    <rect x="88" y="194" width="244" height="52" rx="14" fill="#121c31"/>
    <circle cx="116" cy="220" r="12" fill="#4ade80"/><text x="142" y="228" class="tag">设备 App 保持在线</text>
    <rect x="106" y="282" width="208" height="122" rx="22" fill="#10182b" stroke="#4ade80" stroke-opacity=".45"/>
    <path d="M176 340c22-26 46-26 68 0m-48-21c9-10 19-10 28 0m-16 18h1" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
    <text x="210" y="438" text-anchor="middle" class="label">连接设备硬件</text>
    <text x="210" y="472" text-anchor="middle" class="note">负责蓝牙与实际输出</text>
    <text x="210" y="506" text-anchor="middle" class="note">可以在手机后台运行</text>
  </g>

  <!-- 中间电脑：唯一网关。 -->
  <g filter="url(#shadow)">
    <rect x="432" y="166" width="336" height="378" rx="26" fill="#111c31" stroke="#60a5fa" stroke-opacity=".62" stroke-width="2"/>
    <rect x="470" y="220" width="260" height="170" rx="16" fill="#070a12" stroke="#263654" stroke-width="2"/>
    <rect x="492" y="246" width="216" height="20" rx="10" fill="#17243d"/><rect x="492" y="286" width="154" height="14" rx="7" fill="#60a5fa" opacity=".8"/><rect x="492" y="318" width="190" height="14" rx="7" fill="#67e8f9" opacity=".55"/>
    <path d="M544 410h112l22 34H522z" fill="#263654"/>
    <text x="600" y="482" text-anchor="middle" class="label">电脑桥接服务</text>
    <text x="600" y="516" text-anchor="middle" class="note">运行 start.command，不能关闭</text>
  </g>

  <!-- 右侧手机：APK 在前台读取传感器和显示游戏。 -->
  <g filter="url(#shadow)">
    <rect x="844" y="166" width="292" height="378" rx="26" fill="#0b1120" stroke="#263654" stroke-width="2"/>
    <rect x="868" y="194" width="244" height="52" rx="14" fill="#121c31"/>
    <circle cx="896" cy="220" r="12" fill="#67e8f9"/><text x="922" y="228" fill="#67e8f9" font-size="16" font-weight="700">APK 保持在前台</text>
    <rect x="890" y="282" width="200" height="126" rx="20" fill="#10182b" stroke="#67e8f9" stroke-opacity=".5"/>
    <circle cx="952" cy="344" r="26" fill="none" stroke="#67e8f9" stroke-width="5"/><path d="M1020 313l-17 31 17 31m-40-31h39" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="990" y="438" text-anchor="middle" class="label">GameBridge for Fun</text>
    <text x="990" y="472" text-anchor="middle" class="note">显示游戏并读取手机动作</text>
    <text x="990" y="506" text-anchor="middle" class="note">切后台会立即请求停止</text>
  </g>

  <path d="M356 350h66" stroke="#67e8f9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><path d="M768 350h66" stroke="#67e8f9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <circle cx="389" cy="316" r="18" fill="url(#blue)"/><text x="389" y="323" text-anchor="middle" class="step">1</text>
  <circle cx="801" cy="316" r="18" fill="url(#blue)"/><text x="801" y="323" text-anchor="middle" class="step">2</text>
  <rect x="208" y="592" width="784" height="52" rx="16" fill="#0b1120" stroke="#fb7185" stroke-opacity=".35"/>
  <text x="600" y="625" text-anchor="middle" fill="#fda4af" font-size="18" font-weight="650">缺少其中任何一端，都不能完成真实输出；首次使用必须先做低强度安全试电</text>
</svg>
