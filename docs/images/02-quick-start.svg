<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">六步快速开始</title><desc id="desc">从启动电脑服务到结束使用的六个操作步骤</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#070a12"/></linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="s2"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.t{fill:#f8fafc;font-size:36px;font-weight:750}.s{fill:#8291a8;font-size:18px}.n{fill:#07101f;font-size:22px;font-weight:850}.h{fill:#f8fafc;font-size:21px;font-weight:700}.p{fill:#b7c4d7;font-size:16px}</style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg2)"/><text x="64" y="72" class="t">看图快速开始：按顺序完成 6 步</text><text x="64" y="108" class="s">不要跳过第 4 步的连接自检和安全试电</text>
  <!-- 六张流程卡片保持与产品卡片相同的视觉层级。 -->
  <g filter="url(#s2)">
    <g transform="translate(64 156)"><rect width="332" height="176" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="42" cy="42" r="24" fill="url(#accent2)"/><text x="42" y="50" text-anchor="middle" class="n">1</text><text x="80" y="47" class="h">启动电脑服务</text><text x="28" y="92" class="p">双击 start.command</text><text x="28" y="124" class="p">终端窗口保持打开</text><path d="M272 104h28m-14-14v28" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="translate(434 156)"><rect width="332" height="176" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="42" cy="42" r="24" fill="url(#accent2)"/><text x="42" y="50" text-anchor="middle" class="n">2</text><text x="80" y="47" class="h">绑定设备 App</text><text x="28" y="92" class="p">扫描第 1 个二维码</text><text x="28" y="124" class="p">确认状态变成“已绑定”</text><rect x="270" y="88" width="36" height="36" rx="5" fill="none" stroke="#4ade80" stroke-width="4"/><path d="M277 95h8v8h-8zm14 0h8v8h-8zm-14 14h8v8h-8zm14 14h8" stroke="#4ade80" stroke-width="3"/></g>
    <g transform="translate(804 156)"><rect width="332" height="176" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="42" cy="42" r="24" fill="url(#accent2)"/><text x="42" y="50" text-anchor="middle" class="n">3</text><text x="80" y="47" class="h">连接 APK 或网页</text><text x="28" y="92" class="p">Android 15+ 推荐 APK</text><text x="28" y="124" class="p">重启服务后必须重新扫码</text><rect x="278" y="82" width="30" height="54" rx="6" fill="none" stroke="#67e8f9" stroke-width="4"/></g>
    <g transform="translate(64 372)"><rect width="332" height="176" rx="22" fill="#0b1120" stroke="#fbbf24" stroke-opacity=".55"/><circle cx="42" cy="42" r="24" fill="#fbbf24"/><text x="42" y="50" text-anchor="middle" class="n">4</text><text x="80" y="47" class="h">先自检，再安全试电</text><text x="28" y="92" class="p">从低强度、短时长开始</text><text x="28" y="124" class="p">确认 A/B 接法与限幅</text><path d="M274 108l9 9 22-28" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(434 372)"><rect width="332" height="176" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="42" cy="42" r="24" fill="url(#accent2)"/><text x="42" y="50" text-anchor="middle" class="n">5</text><text x="80" y="47" class="h">选择游戏并调参数</text><text x="28" y="92" class="p">先看规则，再点击开始</text><text x="28" y="124" class="p">APK 必须保持在前台</text><path d="M274 92h34v34h-34z" fill="none" stroke="#60a5fa" stroke-width="4"/><path d="M284 109h14m-7-7v14" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/></g>
    <g transform="translate(804 372)"><rect width="332" height="176" rx="22" fill="#0b1120" stroke="#fb7185" stroke-opacity=".55"/><circle cx="42" cy="42" r="24" fill="#fb7185"/><text x="42" y="50" text-anchor="middle" class="n">6</text><text x="80" y="47" class="h">停止并断开连接</text><text x="28" y="92" class="p">先点“停止输出”</text><text x="28" y="124" class="p">再断开 App，最后关终端</text><rect x="277" y="91" width="30" height="30" rx="5" fill="#fb7185"/></g>
  </g>
  <text x="600" y="624" text-anchor="middle" fill="#67e8f9" font-size="18" font-weight="700">记住顺序：电脑启动 → App 绑定 → 游戏连接 → 自检试电 → 开始游戏 → 停止收尾</text>
</svg>
