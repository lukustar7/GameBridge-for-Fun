<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">手机游戏四阶段操作流程</title><desc id="desc">从选择玩法到设置参数、开始游戏和停止输出</desc>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#070a12"/></linearGradient>
    <linearGradient id="a5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="s5"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".32"/></filter>
    <marker id="ar5" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#60a5fa"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.t{fill:#f8fafc;font-size:36px;font-weight:750}.s{fill:#8291a8;font-size:18px}.h{fill:#f8fafc;font-size:21px;font-weight:750}.p{fill:#b7c4d7;font-size:15px}.n{fill:#07101f;font-size:18px;font-weight:850}</style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg5)"/><text x="64" y="72" class="t">进入游戏后，界面按 4 个阶段前进</text><text x="64" y="108" class="s">游戏不会在选择页直接开始，必须先确认参数</text>
  <g filter="url(#s5)">
    <g transform="translate(54 164)"><rect width="248" height="390" rx="24" fill="#0b1120" stroke="#263654"/><circle cx="38" cy="38" r="21" fill="url(#a5)"/><text x="38" y="45" text-anchor="middle" class="n">1</text><text x="74" y="45" class="h">选择玩法</text><g transform="translate(24 86)"><rect width="200" height="54" rx="14" fill="#121c31"/><text x="18" y="33" class="p">手抖挑战</text><text x="174" y="33" fill="#67e8f9" font-size="13">01</text><rect y="66" width="200" height="54" rx="14" fill="#121c31"/><text x="18" y="99" class="p">摇骰子对决</text><text x="174" y="99" fill="#67e8f9" font-size="13">02</text><rect y="132" width="200" height="54" rx="14" fill="#121c31"/><text x="18" y="165" class="p">极速角子机</text><text x="174" y="165" fill="#67e8f9" font-size="13">03</text><rect y="198" width="200" height="54" rx="14" fill="#121c31"/><text x="18" y="231" class="p">雷电极速</text><text x="174" y="231" fill="#67e8f9" font-size="13">04</text></g><text x="124" y="365" text-anchor="middle" class="p">先选玩法，不会立即输出</text></g>
    <g transform="translate(336 164)"><rect width="248" height="390" rx="24" fill="#0b1120" stroke="#263654"/><circle cx="38" cy="38" r="21" fill="url(#a5)"/><text x="38" y="45" text-anchor="middle" class="n">2</text><text x="74" y="45" class="h">检查设置</text><text x="24" y="104" class="p">输出位置：只用 A</text><rect x="24" y="124" width="200" height="8" rx="4" fill="#263654"/><rect x="24" y="124" width="82" height="8" rx="4" fill="#60a5fa"/><text x="24" y="174" class="p">强度：从低值开始</text><rect x="24" y="194" width="200" height="8" rx="4" fill="#263654"/><rect x="24" y="194" width="54" height="8" rx="4" fill="#67e8f9"/><text x="24" y="244" class="p">时长与间隔：先放慢</text><rect x="24" y="276" width="200" height="52" rx="14" fill="url(#a5)"/><text x="124" y="309" text-anchor="middle" fill="#07101f" font-size="17" font-weight="800">开始游戏</text><text x="124" y="365" text-anchor="middle" class="p">确认接法后才能继续</text></g>
    <g transform="translate(618 164)"><rect width="248" height="390" rx="24" fill="#0b1120" stroke="#263654"/><circle cx="38" cy="38" r="21" fill="url(#a5)"/><text x="38" y="45" text-anchor="middle" class="n">3</text><text x="74" y="45" class="h">保持前台</text><rect x="24" y="86" width="200" height="172" rx="18" fill="#070a12" stroke="#263654"/><circle cx="124" cy="172" r="46" fill="none" stroke="#4ade80" stroke-width="5"/><circle cx="139" cy="157" r="10" fill="#f8fafc"/><text x="124" y="294" text-anchor="middle" class="p">观察状态、压力或骰子结果</text><rect x="24" y="320" width="200" height="44" rx="12" fill="#2a0d18" stroke="#fb7185"/><text x="124" y="348" text-anchor="middle" fill="#fda4af" font-size="16" font-weight="750">停止输出</text></g>
    <g transform="translate(900 164)"><rect width="248" height="390" rx="24" fill="#0b1120" stroke="#fb7185" stroke-opacity=".52"/><circle cx="38" cy="38" r="21" fill="#fb7185"/><text x="38" y="45" text-anchor="middle" class="n">4</text><text x="74" y="45" class="h">结束与收尾</text><path d="M72 126h104v104H72z" fill="#2a0d18" stroke="#fb7185" stroke-width="3"/><rect x="102" y="156" width="44" height="44" rx="7" fill="#fb7185"/><text x="124" y="270" text-anchor="middle" class="p">确认停止反馈</text><text x="124" y="306" text-anchor="middle" class="p">返回列表</text><text x="124" y="338" text-anchor="middle" class="p">断开设备 App</text><text x="124" y="370" text-anchor="middle" class="p">最后关闭电脑终端</text></g>
  </g>
  <path d="M304 360h26" stroke="#60a5fa" stroke-width="4" marker-end="url(#ar5)"/><path d="M586 360h26" stroke="#60a5fa" stroke-width="4" marker-end="url(#ar5)"/><path d="M868 360h26" stroke="#60a5fa" stroke-width="4" marker-end="url(#ar5)"/>
  <text x="600" y="624" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700">A/B 限幅显示“未读取”或 0 时，不要继续安全试电或正式游戏</text>
</svg>
