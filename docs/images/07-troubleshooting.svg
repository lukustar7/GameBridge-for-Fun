<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">无法连接时的排查顺序</title><desc id="desc">依次检查终端、同一 Wi-Fi、重新扫码、证书与限幅</desc>
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#070a12"/></linearGradient>
    <linearGradient id="a7" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <marker id="ar7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#60a5fa"/></marker>
    <filter id="s7"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".28"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.t{fill:#f8fafc;font-size:36px;font-weight:750}.s{fill:#8291a8;font-size:18px}.h{fill:#f8fafc;font-size:19px;font-weight:750}.p{fill:#b7c4d7;font-size:15px}.n{fill:#07101f;font-size:18px;font-weight:850}</style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg7)"/><text x="64" y="72" class="t">连接失败时，按这个顺序排查</text><text x="64" y="108" class="s">从最常见、最容易确认的问题开始，不要先重装软件或证书</text>
  <!-- 五个检查节点按顺序排列，避免用户在多个设置页面间来回猜测。 -->
  <g filter="url(#s7)">
    <g transform="translate(56 166)"><rect width="196" height="278" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="98" cy="54" r="26" fill="url(#a7)"/><text x="98" y="62" text-anchor="middle" class="n">1</text><text x="98" y="112" text-anchor="middle" class="h">电脑终端还在吗</text><text x="98" y="156" text-anchor="middle" class="p">确认 start.command</text><text x="98" y="184" text-anchor="middle" class="p">窗口没有退出</text><rect x="28" y="216" width="140" height="38" rx="12" fill="#0d251c"/><text x="98" y="241" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="750">看“服务已启动”</text></g>
    <g transform="translate(280 166)"><rect width="196" height="278" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="98" cy="54" r="26" fill="url(#a7)"/><text x="98" y="62" text-anchor="middle" class="n">2</text><text x="98" y="112" text-anchor="middle" class="h">是否同一 Wi-Fi</text><text x="98" y="156" text-anchor="middle" class="p">关闭手机流量/VPN</text><text x="98" y="184" text-anchor="middle" class="p">再试当前局域网</text><path d="M70 232c18-20 38-20 56 0m-40-18c8-8 16-8 24 0" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="translate(504 166)"><rect width="196" height="278" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="98" cy="54" r="26" fill="url(#a7)"/><text x="98" y="62" text-anchor="middle" class="n">3</text><text x="98" y="112" text-anchor="middle" class="h">重新扫码</text><text x="98" y="156" text-anchor="middle" class="p">服务每次重启后</text><text x="98" y="184" text-anchor="middle" class="p">旧链接都会过期</text><rect x="71" y="216" width="54" height="54" rx="6" fill="none" stroke="#60a5fa" stroke-width="4"/><path d="M80 225h12v12H80zm22 0h12v12h-12zm-22 22h12v12H80zm24 8h10" stroke="#60a5fa" stroke-width="3"/></g>
    <g transform="translate(728 166)"><rect width="196" height="278" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="98" cy="54" r="26" fill="url(#a7)"/><text x="98" y="62" text-anchor="middle" class="n">4</text><text x="98" y="112" text-anchor="middle" class="h">仅 HTTPS 失败</text><text x="98" y="156" text-anchor="middle" class="p">核对签发 IP</text><text x="98" y="184" text-anchor="middle" class="p">与证书完全信任</text><path d="M78 238v-16a20 20 0 0140 0v16m-48 0h56v34H70z" fill="none" stroke="#fbbf24" stroke-width="4"/></g>
    <g transform="translate(952 166)"><rect width="196" height="278" rx="22" fill="#0b1120" stroke="#263654"/><circle cx="98" cy="54" r="26" fill="url(#a7)"/><text x="98" y="62" text-anchor="middle" class="n">5</text><text x="98" y="112" text-anchor="middle" class="h">页面连上但不输出</text><text x="98" y="156" text-anchor="middle" class="p">检查 App 已绑定</text><text x="98" y="184" text-anchor="middle" class="p">A/B 限幅大于 0</text><rect x="36" y="220" width="124" height="40" rx="12" fill="#2a210b"/><text x="98" y="246" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="750">先做连接自检</text></g>
  </g>
  <path d="M254 304h18" stroke="#60a5fa" stroke-width="4" marker-end="url(#ar7)"/><path d="M478 304h18" stroke="#60a5fa" stroke-width="4" marker-end="url(#ar7)"/><path d="M702 304h18" stroke="#60a5fa" stroke-width="4" marker-end="url(#ar7)"/><path d="M926 304h18" stroke="#60a5fa" stroke-width="4" marker-end="url(#ar7)"/>
  <rect x="140" y="510" width="920" height="92" rx="20" fill="#0b1120" stroke="#fb7185" stroke-opacity=".4"/><text x="600" y="548" text-anchor="middle" fill="#fda4af" font-size="18" font-weight="750">仍然失败：先停止输出，再保存终端提示和页面错误文字</text><text x="600" y="578" text-anchor="middle" class="p">不要分享二维码、完整配对地址、token、证书私钥或 certs/private/ 目录内容</text>
</svg>
